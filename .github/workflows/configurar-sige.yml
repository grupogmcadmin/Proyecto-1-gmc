
name: Configurar SIGE

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  configurar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto SIGE
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar aplicación SIGE
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar SIGE automáticamente
        uses: actions/deploy-pages@v4
